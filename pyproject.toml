[build-system]
requires = ["setuptools>=77", "wheel"]   # SPDX license expression (license = "…")
build-backend = "setuptools.build_meta"

[project]
name = "fcwm"
version = "0.2.0"
description = "EVE Online window manager for KDE Plasma (Wayland and X11): grid layouts, profiles, stacks, hotkeys, live previews"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Jan-Frederic Schubert"}]

requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/jfschubert/FleetCommander"

[project.optional-dependencies]
roundtrip = ["ruamel.yaml"]   # preserve comments in config.yaml when saving from the web UI
app = ["PyQt6-WebEngine"]     # standalone application window (fcwm app) instead of a browser tab

[project.scripts]
fcwm = "fcwm.cli:main"

# Include data folders (static/, locales/) as namespace packages – otherwise setuptools warns
# that they are importable but not declared.
[tool.setuptools.packages.find]
include = ["fcwm*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.html", "*.svg", "*.css", "*.js", "*.json"]
