# FleetCommander – Beispielkonfiguration
# Kopieren nach ~/.config/fcwm/config.yaml (oder config.yaml im Projektordner).
# JSON funktioniert ebenso (gleiche Struktur, Dateiendung .json).

settings:
  backend: auto            # auto | kwin (Wayland + X11 unter Plasma) | x11 (wmctrl/xdotool)
  language: de             # de | en – Sprache der CLI-/Server-Meldungen (Web-UI: Auswahl oben rechts)

  # So werden EVE-Clients erkannt. Die Gruppe (?P<char>…) liefert den Charakternamen.
  match:
    caption_regex: '^EVE - (?P<char>.+)$'
    resource_class: '^steam_app_8500$'   # Steam/Proton-EVE; leer lassen für andere Launcher

  gap: 0                   # Abstand zwischen Rasterzellen in Pixel

  # Fensterdekoration (Titelleiste/Rahmen). Nur relevant für das x11-Backend, das die
  # Client-Geometrie setzt – KWin setzt die Frame-Geometrie, dort wird nichts abgezogen.
  decoration: {top: 0, right: 0, bottom: 0, left: 0}

  min_size: [1024, 768]    # Warnung, wenn ein Slot kleiner ist (EVE-Minimum)

# Monitore bekommen einen frei wählbaren Alias. Zuordnung über den Anschlussnamen
# (`fcwm monitors` zeigt sie) oder über `index:` (0 = ganz links).
monitors:
  left:
    output: DP-5           # Beispiel (hochkant) – `fcwm monitors` zeigt deine Anschlüsse
    grid: 2x2              # Spalten x Zeilen – Slots zeilenweise: 0 1 / 2 3
    reserve: auto          # Panel-Abzug: auto = KWin-Arbeitsbereich, oder manuell:
                           #   reserve: {top: 0, right: 0, bottom: 44, left: 0}
  center:
    output: DP-1           # quer, 3840x2160, hier sitzt die Taskleiste
    grid: 1x1
    reserve: auto
    padding: 0             # zusätzlicher Innenrand (Zahl oder {top:…, …})
  right:
    output: DP-4           # hochkant, 2160x3840
    grid: 2x2
    reserve: auto

default_profile: Solo-Mining

profiles:
  Solo-Mining:
    description: Main gross in der Mitte, Miner links und rechts
    assign:
      # Kurzform  "Charakter": "monitor:slot"
      "Main": center:0
      "Alt 1":   left:0
      "Alt 2":  left:1
      "Alt 3": right:0
      "Alt 4":  right:1
    fill: [left, right]    # weitere, nicht genannte Clients in freie Slots dieser Monitore
    blocked:               # Felder, die nie mit EVE-Clients belegt werden
      "right:3": {label: RIFT, match: "RIFT"}   # optional: dieses Fenster (Titel/Klasse, Regex) dort platzieren
      "left:3": Browser                          # nur frei halten
    focus: Main  # dieses Fenster am Ende aktivieren

  Fleet-Fight:
    description: FC in der Mitte, Alts gestapelt auf den Seiten
    grids:                 # Raster nur für dieses Profil überschreiben
      left: 1x3
      right: 1x3
    assign:
      "Main": center:0
      # Langform mit Span: Slot 0 über 1 Spalte x 2 Zeilen
      "Alt 1": {monitor: left, slot: 0, span: [1, 2]}
    fill: [left, right]
    focus: Main

  Multibox-Center:
    description: Alles auf dem Hauptmonitor, Main doppelt so breit
    grids:
      center: {cols: 2, rows: 2, col_weights: [2, 1]}
    assign:
      "Main": {monitor: center, slot: 0, span: [1, 2]}
    fill: [center, left, right]

  Single-Monitor:
    description: Nur ein Monitor – Main links, Alts rechts gestapelt
    grids:
      center: {cols: 2, rows: 1, col_weights: [2, 1]}
    assign:
      "Main": center:0
      # Mehrere Charaktere auf demselben Slot = Stapel (erster Eintrag liegt oben)
      "Alt 1": center:1
      "Alt 2": center:1
    fill: [center]         # weitere Clients reihum auf die center-Slots stapeln (Standard)
    disabled_monitors: [left, right]   # diese Monitore in diesem Profil nicht verwenden
