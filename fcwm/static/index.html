<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetCommander</title>
<style>
  /* Nachbau des EVE-Clients (Photon-UI, wie er unter Proton gerendert wird):
     schmale Monospace-Schrift, halbtransparente graue Fenster mit feiner Kante,
     Titel mit Icon und ⋮ — ×, Tabs mit hellblauer Unterstreichung, rechteckige
     Buttons, blaugraue Auswahl mit hellem linken Rand, goldener Sternenstaub. */
  :root {
    --font: "DejaVu Sans Mono", "Liberation Mono", "Cousine", "Menlo", monospace;
    --bg: #050505;
    --win: rgba(22, 22, 22, .90); --win-head: rgba(30, 30, 30, .92); --win-line: rgba(255,255,255,.09);
    --text: #c9c9c9; --bright: #f0f0f0; --muted: #8a8a8a; --dim: #5c5c5c;
    --blue: #7fc1e8; --blue-line: #9fd3f2; --sel: rgba(78, 108, 132, .55);
    --banner: rgba(58, 96, 128, .35);
    --row: rgba(255,255,255,.045); --row-hover: rgba(255,255,255,.07);
    --btn: rgba(255,255,255,.06); --btn-line: rgba(255,255,255,.28);
    --ok: #4fc04a; --gold: #e5c33b; --warn: #d9a441; --err: #c24a3e; --sec-low: #d3436c;
    --pin: rgba(78, 108, 132, .55); --auto: rgba(255,255,255,.07); --off: rgba(255,255,255,.025);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--text); font: 12.5px/1.5 var(--font); min-height: 100vh;
    background:
      radial-gradient(1px 1px at 23px 41px, rgba(255,236,190,.75), transparent 60%),
      radial-gradient(1px 1px at 141px 113px, rgba(255,226,160,.6), transparent 60%),
      radial-gradient(1.5px 1.5px at 87px 181px, rgba(255,240,200,.8), transparent 60%),
      radial-gradient(1px 1px at 199px 67px, rgba(255,220,150,.5), transparent 60%),
      radial-gradient(1px 1px at 61px 229px, rgba(255,232,180,.55), transparent 60%),
      radial-gradient(1px 1px at 171px 239px, rgba(255,215,140,.45), transparent 60%);
    background-size: 250px 250px;
    background-color: var(--bg);
  }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(ellipse 45% 35% at 85% 75%, rgba(150, 110, 35, .22), transparent 70%),
      radial-gradient(ellipse 35% 30% at 15% 30%, rgba(120, 85, 30, .16), transparent 70%),
      radial-gradient(ellipse 60% 40% at 55% 10%, rgba(80, 60, 25, .12), transparent 70%); }
  ::selection { background: var(--sel); color: var(--bright); }

  /* Kopfzeile im Stil der EVE-Ticker-Leiste ("GECKO 248,400,000.00 ISK") */
  header { display: flex; align-items: center; gap: 16px; padding: 0 14px; height: 38px; position: sticky; top: 0; z-index: 20;
           background: rgba(12,12,12,.94); border-bottom: 1px solid var(--win-line); }
  .brand { display: flex; align-items: center; gap: 8px; color: var(--bright); white-space: nowrap; font-weight: 700; }
  .brand svg { width: 18px; height: 18px; color: var(--blue); }
  .status { color: var(--text); font-size: 12px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status b { color: var(--bright); font-weight: 400; }
  .status .g { color: var(--ok); }
  .hdr-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .live.on i { background: var(--ok); box-shadow: 0 0 6px var(--ok); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 6px; padding: 6px; max-width: 1800px; margin: 0 auto; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } header .status { display: none; } }
  .col { display: grid; gap: 6px; align-content: start; min-width: 0; }

  /* Fenster */
  .win { background: var(--win); border: 1px solid var(--win-line); min-width: 0; backdrop-filter: blur(3px); }
  .win > .bar { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 6px 0 10px; background: var(--win-head);
                border-bottom: 1px solid var(--win-line); user-select: none; }
  .win > .bar .ico { width: 18px; height: 18px; color: #bdbdbd; flex: none; }
  .win > .bar h2 { margin: 0; font-size: 14px; font-weight: 400; color: #b5b5b5; white-space: nowrap; }
  .win > .bar .extra { margin-left: auto; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .win > .bar .ctl { display: flex; gap: 2px; margin-left: 8px; }
  .win > .bar .extra + .ctl { margin-left: 8px; }
  .win > .bar h2 + .ctl { margin-left: auto; }
  .wbtn { background: none; border: 0; color: #a8a8a8; width: 22px; height: 22px; padding: 0; font: 15px/22px var(--font); cursor: pointer; }
  .wbtn:hover { color: var(--bright); background: rgba(255,255,255,.08); }
  .win > .body { padding: 10px 12px 12px; }
  .win.collapsed > .body { display: none; }

  /* Tabs: grau, aktiv weiss mit hellblauer Linie */
  .tabs { display: flex; gap: 2px 18px; flex-wrap: wrap; margin: -4px 0 12px; border-bottom: 1px solid var(--win-line); }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 6px 2px 7px;
         font: 13px var(--font); cursor: pointer; margin-bottom: -1px; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--bright); border-bottom-color: var(--blue-line); }
  .tab .def { color: var(--gold); margin-left: 5px; }
  .tab .act { color: var(--ok); margin-left: 5px; }
  .tab .dirty { color: var(--warn); margin-left: 5px; font-size: 10px; }

  /* Buttons wie "Jump" / "Rename" / "Destroy" */
  button { font: 12.5px/1 var(--font); color: var(--text); background: var(--btn); border: 1px solid var(--btn-line);
           padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { background: rgba(255,255,255,.12); color: var(--bright); border-color: rgba(255,255,255,.45); }
  button:active:not(:disabled) { background: rgba(255,255,255,.18); }
  button.primary { border-color: rgba(159,211,242,.55); color: var(--bright); background: rgba(127,193,232,.12); }
  button.primary:hover:not(:disabled) { background: rgba(127,193,232,.22); border-color: var(--blue-line); }
  button.danger { border-color: rgba(194,74,62,.75); }
  button.danger:hover:not(:disabled) { border-color: #e0605a; background: rgba(194,74,62,.15); }
  button:disabled { opacity: .35; cursor: default; }
  input, select { font: 12.5px var(--font); color: var(--text); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
                  padding: 6px 8px; border-radius: 0; outline: none; }
  input:focus, select:focus { border-color: rgba(159,211,242,.6); }
  select { padding-right: 6px; }
  select option { background: #1c1c1c; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1 1 220px; min-width: 0; }
  .sep { width: 1px; align-self: stretch; background: var(--win-line); margin: 0 4px; }
  .small { font-size: 11.5px; color: var(--muted); }
  .k { font-size: 11.5px; color: var(--muted); }

  /* Checkbox im EVE-Stil (eckig, hellblauer Haken) – Markup: label.switch > input + .track + .lbl */
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .switch input { display: none; }
  .switch .track { width: 14px; height: 14px; border: 1px solid rgba(255,255,255,.45); background: rgba(0,0,0,.4); position: relative; flex: none; }
  .switch input:checked + .track { border-color: var(--blue-line); background: rgba(127,193,232,.18); }
  .switch input:checked + .track::after { content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px;
           border: solid var(--blue-line); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .switch .lbl { color: var(--text); }
  .switch:hover .track { border-color: var(--bright); }

  /* Info-Banner wie "Clone jump available" */
  .banner { background: var(--banner); padding: 8px 12px; display: flex; align-items: center; gap: 10px; color: var(--bright); }
  .banner.off { background: rgba(255,255,255,.05); color: var(--text); }
  .banner .q { margin-left: auto; width: 16px; height: 16px; border: 1px solid var(--blue-line); border-radius: 50%; color: var(--blue-line);
               font-size: 10px; display: grid; place-items: center; cursor: help; flex: none; }

  /* Charakter-Palette (wie Inventar-Items mit grünem Online-Punkt) */
  #palette { min-height: 42px; border: 1px dashed rgba(255,255,255,.14); padding: 6px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center;
             background: rgba(0,0,0,.2); }
  #palette.over { border-color: var(--blue-line); background: rgba(127,193,232,.08); }
  .chip { padding: 4px 9px 4px 7px; background: var(--row); border: 1px solid transparent; cursor: grab; user-select: none;
          display: inline-flex; gap: 7px; align-items: center; color: var(--text); }
  .chip:hover { background: var(--row-hover); color: var(--bright); }
  .chip .dot { width: 6px; height: 6px; background: var(--dim); }
  .chip.open .dot { background: var(--ok); }
  .chip.pinned { background: var(--sel); box-shadow: inset 2px 0 0 var(--blue-line); color: var(--bright); }
  .chip.auto { box-shadow: inset 2px 0 0 rgba(255,255,255,.35); }
  .chip.unplaced { box-shadow: inset 2px 0 0 var(--warn); }
  .chip .where { color: var(--muted); font-size: 11px; }
  .legend { font-size: 11.5px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }

  /* Monitor-Vorschau */
  #canvas { position: relative; width: 100%; margin-top: 10px; background: rgba(0,0,0,.35); border: 1px solid var(--win-line); overflow: hidden; }
  .mon { position: absolute; background: rgba(14,14,14,.95); border: 1px solid rgba(255,255,255,.14); }
  .mon .label { position: absolute; left: 7px; top: 3px; font-size: 11px; color: var(--muted); z-index: 3; pointer-events: none; }
  .mon.unused { background: repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 6px, transparent 6px 14px), rgba(10,10,10,.95);
               border-style: dashed; }
  .area { position: absolute; background: rgba(255,255,255,.025); }
  .cell { position: absolute; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07); display: flex; flex-direction: column;
          align-items: center; justify-content: center; text-align: center; padding: 4px; overflow: hidden; color: var(--dim); }
  .cell.over { background: rgba(127,193,232,.16); border-color: var(--blue-line); z-index: 5; }
  .cell.p { color: var(--text); z-index: 1; cursor: grab; }
  .cell.p:hover { color: var(--bright); }
  .cell.pinned { background: var(--pin); border-color: rgba(159,211,242,.35); box-shadow: inset 2px 0 0 var(--blue-line); color: var(--bright); }
  .cell.auto { background: var(--auto); border-color: rgba(255,255,255,.14); box-shadow: inset 2px 0 0 rgba(255,255,255,.35); }
  .cell.offline { background: var(--off); border: 1px dashed rgba(229,195,59,.35); color: var(--muted); }
  .cell .nm { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .cell .nm::before { content: ""; width: 6px; height: 6px; background: var(--ok); flex: none; }
  .cell.offline .nm::before { background: var(--gold); }
  .cell .sub { font-size: 11px; color: var(--muted); }
  .cell .idx { position: absolute; left: 7px; bottom: 3px; font-size: 10.5px; color: var(--dim); }
  .cell .tools { position: absolute; right: 3px; top: 3px; display: none; gap: 2px; z-index: 2; }
  .cell:hover .tools { display: flex; }
  .cell .tools button { padding: 3px 6px; font-size: 11px; background: rgba(0,0,0,.7); border-color: rgba(255,255,255,.2); }
  svg.pin { width: 12px; height: 12px; vertical-align: -2px; display: inline-block; }

  /* Stapel: mehrere Charaktere auf einem Slot, oberster zuerst */
  .cell.stack { justify-content: flex-start; align-items: stretch; padding: 4px 6px 16px; gap: 3px; }
  .cell .shead { font-size: 10.5px; color: var(--muted); text-align: right; padding-right: 2px; }
  .cell .slist { display: grid; gap: 2px; overflow-y: auto; min-height: 0; }
  .srow { display: flex; align-items: center; gap: 6px; padding: 2px 4px 2px 6px; background: rgba(0,0,0,.25); cursor: grab; text-align: left; }
  .srow:hover { background: rgba(255,255,255,.08); }
  .srow.top { background: var(--sel); box-shadow: inset 2px 0 0 var(--blue-line); color: var(--bright); }
  .srow.auto { box-shadow: inset 2px 0 0 rgba(255,255,255,.35); }
  .srow.offline { color: var(--muted); }
  .srow.offline .nm::before { background: var(--gold); }
  .srow .nm { font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow .sbtn { display: none; gap: 2px; }
  .srow:hover .sbtn { display: flex; }
  .srow .sbtn button { padding: 1px 5px; font-size: 10px; background: rgba(0,0,0,.6); border-color: rgba(255,255,255,.2); }

  /* Rasterlinien-Griffe */
  .gl { position: absolute; z-index: 6; touch-action: none; }
  .gl.v { width: 11px; margin-left: -5px; cursor: col-resize; }
  .gl.h { height: 11px; margin-top: -5px; cursor: row-resize; }
  .gl::after { content: ""; position: absolute; background: rgba(159,211,242,.0); transition: background .1s; }
  .gl.v::after { left: 5px; top: 0; bottom: 0; width: 1px; }
  .gl.h::after { top: 5px; left: 0; right: 0; height: 1px; }
  .gl:hover::after, body.drag-v .gl.v:hover::after, body.drag-h .gl.h:hover::after { background: var(--blue-line); box-shadow: 0 0 6px var(--blue-line); }
  .gl::before { content: ""; position: absolute; width: 7px; height: 7px; background: rgba(159,211,242,.55); left: 50%; top: 50%;
                transform: translate(-50%, -50%) rotate(45deg); opacity: .55; }
  .gl:hover::before { opacity: 1; background: var(--blue-line); }
  body.drag-v, body.drag-v * { cursor: col-resize !important; user-select: none; }
  body.drag-h, body.drag-h * { cursor: row-resize !important; user-select: none; }
  #gltip { position: fixed; display: none; z-index: 60; pointer-events: none; background: rgba(20,20,20,.96); color: var(--bright);
           border: 1px solid rgba(255,255,255,.2); padding: 3px 8px; font-size: 11.5px; white-space: pre; }

  /* Freigehaltene Felder (Browser, RIFT …) */
  .cell.blocked { background: repeating-linear-gradient(135deg, rgba(229,195,59,.07) 0 5px, transparent 5px 12px), rgba(0,0,0,.35);
                  border: 1px dashed rgba(229,195,59,.4); color: var(--muted); z-index: 1; }
  .cell.blocked .bl { color: #e8d48a; font-size: 13px; }
  .cell.blocked .bl::before { content: "⊘ "; color: rgba(229,195,59,.7); }
  .cell.blocked.preview { background: repeating-linear-gradient(135deg, rgba(127,193,232,.07) 0 5px, transparent 5px 12px), rgba(0,0,0,.35);
                          border-color: rgba(159,211,242,.45); }
  .cell.blocked.preview .bl { color: var(--blue); }
  .cell.blocked.preview .bl::before { content: ""; }
  .cell.blocked, .badge, .sgtag { cursor: grab; }
  /* Kurzbefehl-Felder: Klick, dann Taste drücken */
  input.keycap { cursor: pointer; text-align: center; min-width: 150px; }
  input.keycap.rec { border-color: var(--blue-line); background: rgba(127,193,232,.12); color: var(--bright); }
  .pop { position: fixed; display: none; z-index: 70; gap: 10px; width: 290px; padding: 12px; background: rgba(24,24,24,.98);
         border: 1px solid rgba(255,255,255,.18); box-shadow: inset 0 2px 0 var(--blue-line), 0 10px 30px rgba(0,0,0,.6); }
  .pop b { font-weight: 400; color: var(--bright); }
  /* Überlauf-Felder + Stapel-Kurzbefehle als kleine Schilder */
  .badge { position: absolute; z-index: 7; padding: 1px 6px; font-size: 10.5px; line-height: 16px; cursor: pointer; white-space: nowrap;
           background: rgba(0,0,0,.78); border: 1px solid; }
  .badge.of { border-color: rgba(229,195,59,.6); color: #e8d48a; }
  .badge.hk { border-color: rgba(159,211,242,.5); color: var(--blue); }
  .cell.ofl:not(.p) { border: 1px dashed rgba(229,195,59,.45); }
  .badge.sp { border-color: rgba(159,211,242,.5); color: var(--blue); }
  .spstrip { position: absolute; z-index: 3; pointer-events: none; border: 1px dashed rgba(159,211,242,.6);
             background: repeating-linear-gradient(90deg, rgba(127,193,232,.18) 0 18px, rgba(127,193,232,.06) 18px 22px); }
  #tbChars li { align-items: center; }
  input[type=color] { width: 34px; height: 22px; padding: 0 2px; background: transparent; border: 1px solid rgba(255,255,255,.2); cursor: pointer; }
  .clr { display: inline-flex; gap: 4px; align-items: center; }
  .clr button { padding: 2px 6px; font-size: 11px; }

  /* Subgrids */
  .subframe { position: absolute; border: 1px solid rgba(159,211,242,.35); pointer-events: none; z-index: 2; }
  .subframe .sgtag { pointer-events: auto; position: absolute; left: 3px; top: 3px; padding: 1px 5px; font-size: 10.5px;
                     background: rgba(0,0,0,.75); border-color: rgba(159,211,242,.45); color: var(--blue); z-index: 4; }
  .cell.subcell { border-color: rgba(159,211,242,.14); }
  .cell.tiny { padding: 2px; }
  .cell.tiny .sub, .cell.tiny .shead { display: none; }
  .cell.tiny .nm { font-size: 11px; }
  .cell.tiny .idx { font-size: 9px; left: 3px; bottom: 1px; }
  .gl.sg::before { width: 5px; height: 5px; }
  #subpop { position: fixed; display: none; z-index: 70; gap: 10px; width: 280px; padding: 12px; background: rgba(24,24,24,.98);
            border: 1px solid rgba(255,255,255,.18); box-shadow: inset 0 2px 0 var(--blue-line), 0 10px 30px rgba(0,0,0,.6); }
  #subpop b { font-weight: 400; color: var(--bright); }
  #cellpop { position: fixed; display: none; z-index: 70; gap: 8px; width: 300px; padding: 12px; background: rgba(24,24,24,.98);
             border: 1px solid rgba(255,255,255,.18); box-shadow: inset 0 2px 0 var(--blue-line), 0 10px 30px rgba(0,0,0,.6); }
  #cellpop input { width: 100%; }

  /* Monitor-Karten (wie Listen-Gruppen mit ▸) */
  #moncards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px; margin-top: 8px; }
  .mcard { background: var(--row); padding: 8px 10px; display: grid; gap: 7px; }
  .mcard.off { opacity: .55; }
  .mcard.off .switch { opacity: 1; }
  .mcard .t { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
  .mcard .t b { font-weight: 400; color: var(--bright); }
  .mcard .t b::before { content: "▸ "; color: var(--muted); }
  .stepper { display: inline-flex; align-items: center; border: 1px solid rgba(255,255,255,.18); }
  .stepper button { border: 0; padding: 4px 8px; background: transparent; }
  .stepper span { min-width: 20px; text-align: center; color: var(--bright); }
  .mcard a { color: var(--blue); text-decoration: none; }
  .mcard a:hover { text-decoration: underline; }
  .mcard input[type=checkbox] { accent-color: #7fc1e8; vertical-align: -2px; }

  /* Meldungen */
  .msg { padding: 7px 10px; margin-top: 8px; border-left: 2px solid; background: rgba(255,255,255,.04); }
  .msg.warn { border-color: var(--warn); color: #e6c486; }
  .msg.err { border-color: var(--err); color: #ec9a91; }
  .msg.ok { border-color: var(--ok); color: #a9dba6; }

  /* Listen (Clients, Monitore, Ereignisse) */
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; align-items: center; }
  ul.list { list-style: none; padding: 0; margin: 0; }
  ul.list li { padding: 5px 8px; display: flex; justify-content: space-between; gap: 8px; }
  ul.list li:nth-child(odd) { background: rgba(255,255,255,.025); }
  ul.list li:hover { background: var(--row-hover); }
  #clients li span:first-child::before { content: ""; display: inline-block; width: 6px; height: 6px; background: var(--ok); margin-right: 8px; vertical-align: 1px; }
  #log { max-height: 340px; overflow-y: auto; }
  #log li { display: grid; grid-template-columns: auto 1fr; gap: 10px; justify-content: start; }
  #log time { color: var(--dim); white-space: nowrap; }
  #log .login { color: var(--blue); } #log .placed { color: #9fd49b; } #log .closed { color: var(--muted); } #log .error { color: #ec9a91; }

  /* Benachrichtigungen unten rechts */
  #toasts { position: fixed; right: 14px; bottom: 14px; display: grid; gap: 6px; z-index: 50; width: min(380px, calc(100vw - 28px)); }
  .toast { background: rgba(24,24,24,.97); border: 1px solid rgba(255,255,255,.14); box-shadow: inset 2px 0 0 var(--blue-line), 0 6px 20px rgba(0,0,0,.6);
           padding: 8px 12px; animation: tin .18s ease-out; }
  .toast .tt { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  .toast.ok { box-shadow: inset 2px 0 0 var(--ok), 0 6px 20px rgba(0,0,0,.6); }
  .toast.warn { box-shadow: inset 2px 0 0 var(--warn), 0 6px 20px rgba(0,0,0,.6); }
  .toast.err { box-shadow: inset 2px 0 0 var(--err), 0 6px 20px rgba(0,0,0,.6); }
  @keyframes tin { from { transform: translateY(8px); opacity: 0; } }

  textarea { width: 100%; min-height: 380px; background: rgba(0,0,0,.45); color: var(--text); border: 1px solid rgba(255,255,255,.1);
             padding: 10px; font: 12px/1.5 var(--font); }

// ============================================================ Zustand
function draft() {

    const first = !state;
    state = await api("/api/state");
    const keys = [...Object.keys(state.models), ...Object.keys(drafts).filter(k => !state.models[k])];
    if (!keep || !cur || !keys.includes(cur)) cur = state.default_profile || keys[0] || null;

// Gewichte der Rasterlinien. Gespeichert als [spalten|null, zeilen|null, {zeile: spalten}|null] –

    e[2] = rc;

  if (/^Digit\d$/.test(c)) return c.slice(5);
  if (/^Numpad\d$/.test(c)) return "Num+" + c.slice(6);
  if (/^F\d{1,2}$/.test(k)) return k;
  const map = {ArrowLeft: "Left", ArrowRight: "Right", ArrowUp: "Up", ArrowDown: "Down", PageUp: "PgUp", PageDown: "PgDown",
               " ": "Space", Tab: "Tab", Home: "Home", End: "End", Insert: "Ins", Enter: "Return", Pause: "Pause",
               Backquote: "`", Minus: "-", Equal: "=", BracketLeft: "[", BracketRight: "]", Semicolon: ";", Quote: "'",
               Comma: ",", Period: ".", Slash: "/", Backslash: "\\"};
  return map[k] || map[c] || null;
}
function bindKeyCapture(input, onSet) {
  input.addEventListener("focus", () => { input.dataset.old = input.value; input.classList.add("rec"); input.value = ""; input.placeholder = t("pressKey"); });
  input.addEventListener("blur", () => { input.classList.remove("rec"); if (!input.value) input.value = input.dataset.old || ""; input.placeholder = t("noKey"); });
  input.addEventListener("keydown", (ev) => {
    ev.preventDefault(); ev.stopPropagation();
    if (ev.key === "Escape") { input.value = input.dataset.old || ""; input.blur(); return; }
    if ((ev.key === "Backspace" || ev.key === "Delete") && !ev.ctrlKey && !ev.altKey && !ev.metaKey) {
      input.dataset.old = ""; input.value = ""; input.blur(); onSet(""); return;
    }
    if (["Control", "Alt", "Shift", "Meta", "OS", "AltGraph"].includes(ev.key)) return;
    const name = keyName(ev);
    if (!name) return;
    const mods = [ev.metaKey && "Meta", ev.ctrlKey && "Ctrl", ev.altKey && "Alt", ev.shiftKey && "Shift"].filter(Boolean);
    const combo = [...mods, name].join("+");

  });
}

                           e.unplaced.length ? t("evUnplaced", {list: e.unplaced.join(", ")}) : ""].filter(Boolean).join(" · ");
    case "profile": return t("evProfile", {name: e.name, n: e.placed});
    case "error": return e.message;
    case "auto": return e.enabled ? t("evAutoOn", {profile: e.effective_profile}) : t("evAutoOff");
  }
  return JSON.stringify(e);
}
function logEvent(e, live = true) {
  if (e.type === "placed" && !e.items.length && !e.unplaced.length) return;
  const li = document.createElement("li");
  const time = new Date(e.ts * 1000).toLocaleTimeString(lang, {hour: "2-digit", minute: "2-digit", second: "2-digit"});
  li.innerHTML = `<time>${time}</time><span class="${e.type}">${esc(eventText(e))}</span>`;
  $("log").prepend(li);
  while ($("log").children.length > 100) $("log").lastChild.remove();
  if (!live) return;
  if (e.type === "login") toast(t("tNew"), eventText(e));
  if (e.type === "placed") toast(t("tPlaced"), eventText(e), e.unplaced.length ? "warn" : "ok");
  if (e.type === "error") toast(t("tError"), e.message, "err");
  if (e.type === "profile") toast(t("tProfile"), eventText(e), "ok");
}
function connectEvents() {
  const es = new EventSource("/api/events");
  es.onopen = () => $("live").classList.add("on");
  es.onerror = () => $("live").classList.remove("on");
  es.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.type === "auto") { setAuto(e); logEvent(e); return; }
    logEvent(e);
    if (["login", "closed", "placed", "profile"].includes(e.type)) scheduleRefresh();
  };
}

function drawCanvas() {
  const cv = $("canvas"), mons = state.monitors;

  const maxX = Math.max(...mons.map(m => m.geometry[0] + m.geometry[2])), maxY = Math.max(...mons.map(m => m.geometry[1] + m.geometry[3]));
  const s = cv.clientWidth / (maxX - minX);

    `<div class="${cls}" ${attrs} style="left:${(r[0]-minX)*s}px;top:${(r[1]-minY)*s}px;width:${r[2]*s}px;height:${r[3]*s}px">${inner}</div>`;
  const small = (r) => r[2] * s < 90 || r[3] * s < 60;   // sehr kleine Zellen kompakter beschriften

  const aliasOf = Object.fromEntries(Object.entries(state.monitor_config).filter(([, mc]) => mc.output).map(([a, mc]) => [mc.output, a]));

    const [cols] = plan.layouts[x.monitor].grid;
    for (let r = 0; r < span[1]; r++) for (let c = 0; c < span[0]; c++) taken.add(`${x.monitor}:${x.slot + r * cols + c}`);
  };
  plan.placements.forEach(p => mark(p, p.span));

  for (const [alias, lay] of Object.entries(plan.layouts)) {

    lay.cells.forEach((c, i) => {

                        `<span class="idx">${esc(alias)}:${i}.${j}</span><span class="sub">${sc[2]}×${sc[3]}</span>`, placeAttrs(alias, i, j));
        });
      } else if (!taken.has(`${alias}:${i}`)) {
        html += box(c, `cell drop ${ofKeys.has(`${alias}:${i}`) ? "ofl" : ""}`, `<span class="tools">${emptyTools(alias, i, null)}<button data-act="split" title="${esc(t("splitCell"))}">⊞</button><button data-act="block" title="${esc(t("blockCell"))}">⊘</button></span>` +
                    `<span class="idx">${esc(alias)}:${i}</span><span class="sub">${c[2]}×${c[3]}</span>`, placeAttrs(alias, i, null));

  for (const b of plan.blocked) {

    const bdnd = esc(JSON.stringify({kind: "blocked", mon: b.monitor, slot: b.slot, sub: subOf(b)}));
    html += box(b.rect, `cell blocked ${b.preview ? "preview" : ""} ${small(b.rect) ? "tiny" : ""}`,
      `<span class="tools"><button data-act="edit" title="${esc(t("editCell"))}">✎</button><button data-act="unblock" title="${esc(t("unblockCell"))}">✕</button></span>` +
      `<span class="bl">${b.preview ? "▣ " : ""}${esc(b.label || (b.preview ? t("preview") : t("keptFree")))}</span><span class="sub">${esc(sub)}</span><span class="idx">${esc(b.monitor)}:${sl(b.slot, subOf(b))}</span>`,
      placeAttrs(b.monitor, b.slot, subOf(b)) + ` draggable="true" data-dnd="${bdnd}" title="${esc(t("dragCellType"))}"`);
  }

  const tools = (auto, inSub) => `<span class="tools">` + (auto
    ? `<button data-act="pin" title="${esc(t("pinHere"))}">${PIN}</button>`

      (inSub ? "" : `<button data-act="w" title="${esc(t("wider"))}">⇥</button><button data-act="h" title="${esc(t("taller"))}">⤓</button>`) +
      `<button data-act="x" title="${esc(t("remove"))}">✕</button>`) + `</span>`;

  // Platzierungen + offline reservierte Plätze nach Stapel (Monitor:Slot[.Sub]) gruppieren
  const order = Object.fromEntries(model().assign.map((a, i) => [a.char, i]));
  const items = [

  const stacks = {};
  for (const it of items) (stacks[`${it.monitor}:${sl(it.slot, subOf(it))}`] ??= []).push(it);

    if (members.length === 1) {

      html += box(top.rect, `cell p drop ${top.kind} ${inSub ? "subcell" : ""} ${tiny}`,

        : (i > 0 ? `<button data-act="up" title="${esc(t("toTop"))}">▲</button>` : "") +
          `<button data-act="x" title="${esc(t("remove"))}">✕</button>`;
      return `<div class="srow ${it.kind} ${i === 0 ? "top" : ""}" draggable="true" data-char="${esc(it.char)}">` +
        `<span class="nm">${esc(it.char)}</span><span class="sbtn">${btns}</span></div>`;
    }).join("");
    const stackTools = `<span class="tools"><button data-act="hk" title="${esc(t("setHotkey"))}">⌨</button><button data-act="spv" title="${esc(t("setStackPreview"))}">▣</button>` +
      (top.auto || inSub ? "" : `<button data-act="w" title="${esc(t("wider"))}">⇥</button><button data-act="h" title="${esc(t("taller"))}">⤓</button>`) + `</span>`;
    html += box(top.rect, `cell p drop stack ${top.kind} ${inSub ? "subcell" : ""} ${tiny}`,
      `${stackTools}<div class="shead">${esc(t("stack", {n: members.length}))}</div><div class="slist">${rows}</div>` +
      `<span class="idx">${idx} · ${top.rect[2]}×${top.rect[3]}</span>`,
      `data-char="${esc(top.char)}" ${where}`);
  }

  // Schilder: Überlauf-Reihenfolge/Max und Stapel-Kurzbefehle
  const at = (r, dx, dy, cls, text, attrs) =>
    `<span class="badge ${cls}" ${attrs} style="left:${(r[0] - minX) * s + dx}px;top:${(r[1] - minY) * s + dy}px">${esc(text)}</span>`;
  (plan.overflow || []).forEach((o, i) => {
    html += at(o.rect, 4, 3, "of", `⇊ ${o.order} · ${o.max ? "max " + o.max : "∞"}${o.count ? " · " + o.count : ""}`,
               `data-i="${i}" draggable="true" data-dnd="${esc(JSON.stringify({kind: "overflow", i}))}" title="${esc(t("dragCellType"))}"`);
  });
  for (const [k, keys] of Object.entries(model().stack_hotkeys || {})) {
    const [mon, rest] = k.split(":"), [slot, sub] = rest.split(".");
    const lay = plan.layouts[mon];
    if (!lay) continue;
    const rect = sub === undefined ? lay.cells[+slot] : ((lay.subgrids || {})[slot] || {cells: []}).cells[+sub];
    if (rect) html += at(rect, 4, Math.max(22, rect[3] * s - 40), "hk", `⌨ ${keys}`, placeAttrs(mon, +slot, sub === undefined ? null : +sub) +
                         ` draggable="true" data-dnd="${esc(JSON.stringify({kind: "hotkey", key: k}))}" title="${esc(t("dragCellType"))}"`);
  }

  for (const sp of plan.stack_previews || []) {
    html += box(sp.rect, "spstrip", "");
    const label = `▣ ${t(sp.mode === "all" ? "spvAllShort" : "spvStackShort")}`;
    html += at(sp.stack, Math.max(4, sp.stack[2] * s - 110), 3, "sp", label, placeAttrs(sp.monitor, sp.slot, sp.sub) +
               ` draggable="true" data-dnd="${esc(JSON.stringify({kind: "stackpreview", key: sp.key}))}" title="${esc(t("dragCellType"))}"`);
  }

  // Verschiebbare Rasterlinien (Monitor-Raster und Subgrids)
  canvasMap = {minX, minY, s};
  const lines = (alias, slot, area, grid, c) => {
    const [cols, rows] = grid, attrs = `data-mon="${esc(alias)}" data-gslot="${slot ?? ""}"`, cls = slot === null ? "" : "sg";
    for (let r = 0; r < rows; r++) {
      for (let k = 0; k < cols - 1; k++) {
        const a = c[r * cols + k], b = c[r * cols + k + 1], x = (a[0] + a[2] + b[0]) / 2;
        const top = r === 0 ? area[1] : a[1], bottom = r === rows - 1 ? area[1] + area[3] : a[1] + a[3];
        html += `<div class="gl v ${cls}" ${attrs} data-axis="0" data-k="${k}" data-row="${r}" title="${esc(t(rows > 1 ? "dragLineRow" : "dragLine"))}"
          style="left:${(x - minX) * s}px;top:${(top - minY) * s}px;height:${(bottom - top) * s}px"></div>`;
      }
    }
    for (let k = 0; k < rows - 1; k++) {
      const i = k * cols, y = (c[i][1] + c[i][3] + c[i + cols][1]) / 2;
      html += `<div class="gl h ${cls}" ${attrs} data-axis="1" data-k="${k}" title="${esc(t("dragLine"))}"
        style="top:${(y - minY) * s}px;left:${(area[0] - minX) * s}px;width:${area[2] * s}px"></div>`;
    }
  };
  for (const [alias, lay] of Object.entries(plan.layouts)) {
    lines(alias, null, lay.area, lay.grid, lay.cells);
    for (const [slot, sg] of Object.entries(lay.subgrids || {})) lines(alias, +slot, lay.cells[+slot], sg.grid, sg.cells);
  }
  cv.innerHTML = html;
  cv.querySelectorAll(".gl").forEach(el => el.onpointerdown = startLineDrag);
  cv.querySelectorAll(".badge.of").forEach(el => el.onclick = () => openOfPop(+el.dataset.i));
  cv.querySelectorAll(".badge.hk").forEach(el => el.onclick = () => openHkPop(...placeOf(el)));
  cv.querySelectorAll(".badge.sp").forEach(el => el.onclick = () => openSpPop(...placeOf(el)));
}

// ---- Rasterlinien ziehen (Pointer-Events, live Vorschau)
let canvasMap = null, lineDrag = null, lastLinePreview = 0;
function startLineDrag(ev) {
  ev.preventDefault();
  const d = ev.currentTarget.dataset, lay = plan.layouts[d.mon], slot = d.gslot === "" ? null : +d.gslot;
  lineDrag = {alias: d.mon, slot, axis: +d.axis, k: +d.k, row: d.row === undefined ? null : +d.row,
              area: slot === null ? lay.area : lay.cells[slot]};
  document.body.classList.add(+d.axis ? "drag-h" : "drag-v");
  $("gltip").style.display = "block";
  moveLineDrag(ev);
}
function moveLineDrag(ev) {
  if (!lineDrag) return;
  const {alias, slot, axis, k, area} = lineDrag, rect = $("canvas").getBoundingClientRect(), {minX, minY, s} = canvasMap;
  // senkrechte Linie: nur diese Zeile; mit Strg die ganze Linie über alle Zeilen
  const row = axis === 0 && !ev.ctrlKey ? lineDrag.row : null;
  const pos = axis === 0 ? (ev.clientX - rect.left) / s + minX : (ev.clientY - rect.top) / s + minY;
  let p = (pos - area[axis]) / area[axis + 2];
  const w = weightsOf(alias, axis, slot, row), total = w.reduce((x, y) => x + y, 0);
  const f = w.map(x => x / total), lo = f.slice(0, k).reduce((x, y) => x + y, 0), hi = lo + f[k] + f[k + 1];
  const MIN = 0.05;
  p = Math.min(hi - MIN, Math.max(lo + MIN, p));
  p = ev.shiftKey ? Math.round(p * 12) / 12 : Math.round(p * 200) / 200;   // Shift: auf 1/12 einrasten
  p = Math.min(hi - MIN, Math.max(lo + MIN, p));
  f[k] = p - lo; f[k + 1] = hi - p;
  const nw = f.map(x => Math.round(x * 1000) / 10);
  if (axis === 0 && row === null) {   // Strg: ganze Linie -> Zeilen-Ausnahmen aufheben
    const e = weightEntry(alias, slot);
    if (e && e[2]) e[2] = null;
  }
  setWeights(alias, axis, nw, slot, row);
  const px = Math.round(area[axis + 2] * f[k]), px2 = Math.round(area[axis + 2] * f[k + 1]);
  const tip = $("gltip");
  const scope = axis === 0 ? (row === null ? t("allRows") : t("rowN", {n: row + 1})) + "  " : "";
  tip.textContent = `${scope}${(f[k] * 100).toFixed(1)}% | ${(f[k + 1] * 100).toFixed(1)}%   ${px} | ${px2} px`;
  tip.style.left = ev.clientX + 14 + "px"; tip.style.top = ev.clientY + 14 + "px";
  draft().dirty = true;
  const now = Date.now();
  if (now - lastLinePreview > 60) { lastLinePreview = now; preview(); }
}
function endLineDrag() {
  if (!lineDrag) return;
  lineDrag = null;
  document.body.classList.remove("drag-h", "drag-v");
  $("gltip").style.display = "none";
  changed();
}
window.addEventListener("pointermove", moveLineDrag);
window.addEventListener("pointerup", endLineDrag);

      <div class="row">
        <label class="small"><input type="checkbox" data-fill ${m.fill.includes(alias) ? "checked" : ""} ${used ? "" : "disabled"}> ${esc(t("fillFree"))}</label>
        <span class="small" style="margin-left:auto">${moved ? `<a href="#" data-g="even">${esc(t("evenLines"))}</a> · ` : ""}${isDef ? esc(t("defaultGrid")) : `<a href="#" data-g="reset">${esc(t("resetTo", {g: `${def[0]}×${def[1]}`}))}</a>`}</span>
      </div>
    </div>`;
  }).join("");
  document.querySelectorAll(".mcard").forEach(card => {
    const alias = card.dataset.mon;
    card.querySelectorAll("[data-g]").forEach(b => b.onclick = (ev) => {
      ev.preventDefault();
      const [c, r] = gridOf(alias), g = b.dataset.g;
      if (g === "reset") {
        const dw = state.monitor_config[alias].weights;
        setGrid(alias, ...state.monitor_config[alias].grid);
        model().weights = model().weights || {};
        if (dw) model().weights[alias] = clone(dw); else delete model().weights[alias];
        return changed();
      }
      if (g === "even") { setWeights(alias, 0, null); setWeights(alias, 1, null); return changed(); }
      setGrid(alias, c + (g === "c+") - (g === "c-"), r + (g === "r+") - (g === "r-"));
    });
    card.querySelector("[data-fill]").onchange = (ev) => toggleFill(alias, ev.target.checked);
    card.querySelector("[data-use]").onchange = (ev) => toggleUse(alias, ev.target.checked);
  });
}

function acceptDrop(el, onDrop, onCell = null) {
  const ok = (ev) => ev.dataTransfer.types.includes(DT) || (onCell && ev.dataTransfer.types.includes(DTC));
  el.addEventListener("dragover", ev => { if (ok(ev)) { ev.preventDefault(); ev.stopPropagation(); el.classList.add("over"); } });
  el.addEventListener("dragleave", () => el.classList.remove("over"));
  el.addEventListener("drop", ev => {
    ev.preventDefault(); ev.stopPropagation(); el.classList.remove("over");
    const cell = ev.dataTransfer.getData(DTC);
    if (cell && onCell) return onCell(JSON.parse(cell));
    onDrop(ev.dataTransfer.getData(DT), ev.shiftKey);
  });
}
function bindDnD() {
  document.querySelectorAll("[draggable=true]").forEach(el =>
    el.addEventListener("dragstart", ev => {
      ev.stopPropagation();
      if (el.dataset.dnd) ev.dataTransfer.setData(DTC, el.dataset.dnd);
      else ev.dataTransfer.setData(DT, el.dataset.char);
      ev.dataTransfer.effectAllowed = "move";
    }));
  const onCell = (el) => (d) => moveCellThing(d, placeOf(el));
  document.querySelectorAll(".cell.blocked").forEach(el => {
    el.ondblclick = () => editCell(...placeOf(el));
    acceptDrop(el, () => flash(t("dropOnBlocked"), "warn"), onCell(el));
  });
  document.querySelectorAll(".cell.drop").forEach(el => acceptDrop(el, (char, shift) => {
    if (char) assignTo(char, ...placeOf(el), shift);
  }, onCell(el)));
  document.querySelectorAll(".cell .tools button, .srow button, .subframe .sgtag").forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    const cell = b.closest(".cell, .subframe"), char = (b.closest(".srow") || cell).dataset.char;
    const [mon, slot, sub] = placeOf(cell);
    ({pin: () => assignTo(char, mon, slot, sub, false, false), w: () => growSpan(char, 0),
      h: () => growSpan(char, 1), x: () => unassign(char), up: () => raiseInStack(char),
      block: () => blockCell(mon, slot, sub), unblock: () => unblockCell(mon, slot, sub),
      edit: () => editCell(mon, slot, sub), split: () => splitCell(mon, slot),
      overflow: () => addOverflow(mon, slot, sub), hk: () => openHkPop(mon, slot, sub), spv: () => openSpPop(mon, slot, sub),
      subedit: () => openSubPop(mon, slot)})[b.dataset.act]();
  });
}
acceptDrop($("palette"), unassign);   // Palette = Ablage zum Entfernen

// ============================================================ Bedienelemente
$("cpSave").onclick = saveCellPop;
$("cpPreview").onchange = () => {
  $("cpMatchWrap").style.display = $("cpPreview").value ? "none" : "";
  $("cpShowWrap").style.display = $("cpPreview").value ? "" : "none";
};
document.querySelectorAll("[data-sp]").forEach(b => b.onclick = () => {
  const [mon, slot] = [$("subpop").dataset.mon, +$("subpop").dataset.slot], sg = subgridOf(mon, slot), g = b.dataset.sp;
  if (!sg) return;
  setSubgrid(mon, slot, sg.grid[0] + (g === "c+") - (g === "c-"), sg.grid[1] + (g === "r+") - (g === "r-"));
  setTimeout(() => openSubPop(mon, slot), 300);
});
$("spEven").onclick = () => {
  const mon = $("subpop").dataset.mon, slot = +$("subpop").dataset.slot;
  setWeights(mon, 0, null, slot); setWeights(mon, 1, null, slot); changed();
  setTimeout(() => openSubPop(mon, slot), 300);
};
$("spMerge").onclick = () => mergeCell($("subpop").dataset.mon, +$("subpop").dataset.slot);
$("spClose").onclick = () => { $("subpop").style.display = "none"; };
$("cpCancel").onclick = () => { $("cellpop").style.display = "none"; };
$("subpop").onkeydown = (ev) => { if (ev.key === "Escape") $("spClose").click(); };
$("cellpop").onkeydown = (ev) => { if (ev.key === "Enter") saveCellPop(); if (ev.key === "Escape") $("cpCancel").click(); };
$("pname").oninput = () => { draft().name = $("pname").value.trim(); draft().dirty = true; renderHeader(); };
$("pdesc").oninput = () => { model().description = $("pdesc").value; draft().dirty = true; renderHeader(); };
$("pfocus").onchange = () => { model().focus = $("pfocus").value || null; changed(); };
$("save").onclick = save;
$("discard").onclick = () => {
  const d = draft();
  delete drafts[cur];
  if (!d.oldName) cur = state.default_profile || Object.keys(state.models)[0];
  if (!cur) newProfile();
  renderHeader(); preview();
};
$("dup").onclick = () => { newProfile(draft()); renderHeader(); preview(); };
$("mkdefault").onclick = async () => {
  try { await api("/api/default", {name: draft().oldName}); flash(t("defaultSet")); await load(); }
  catch (e) { flash(e.message, "err"); }
};
$("del").onclick = async () => {
  const d = draft();
  if (!confirm(t("confirmDelete", {name: d.name}))) return;
  try {
    if (d.oldName) await api("/api/profile/delete", {name: d.oldName});
    delete drafts[cur]; cur = null;
    flash(t("profileDeleted", {name: d.name}));
    await load(false);
  } catch (e) { flash(e.message, "err"); }
};
$("apply").onclick = async () => {
  $("apply").disabled = true;
  try {
    const d = draft();
    const p = await api("/api/apply", {name: d.name, model: d.model});
    flash(t("placedN", {n: p.placements.length, name: d.name + (d.dirty ? `, ${t("unsaved")}` : "")}));
    await load();
  } catch (e) { flash(e.message, "err"); }
  finally { $("apply").disabled = false; }
};
$("refresh").onclick = () => load();
$("addchar").onclick = () => {
  const c = $("newchar").value.trim();
  if (!c) return;
  if (!extraChars.includes(c)) extraChars.push(c);
  try { localStorage.setItem("fcwm.extraChars", JSON.stringify(extraChars)); } catch {}
  $("newchar").value = "";
  renderEditor();
};
$("newchar").onkeydown = (ev) => { if (ev.key === "Enter") $("addchar").click(); };
$("lang").onchange = () => {
  lang = $("lang").value;
  try { localStorage.setItem("fcwm.lang", lang); } catch {}
  applyStatic();
  if (auto) setAuto(auto);
  $("log").innerHTML = "";
  state.events.forEach(e => logEvent(e, false));
  load();   // Server-Meldungen (Warnungen) in der neuen Sprache holen
};

$("cfgdetails").addEventListener("toggle", async (ev) => {
  if (ev.target.open) $("cfg").value = await api("/api/config");
});
$("reloadCfg").onclick = async () => {
  try {
    await api("/api/reload", {});
    for (const k of Object.keys(drafts)) if (!drafts[k].dirty) delete drafts[k];
    flash(t("cfgReloaded")); await load();
  } catch (e) { flash(e.message, "err"); }
};
$("restartWm").onclick = async () => {
  if (Object.values(drafts).some(d => d.dirty) && !confirm(t("restartDirty"))) return;
  try {
    await api("/api/restart", {});
    flash(t("restartingUi"), "warn");
    for (let i = 0; i < 40; i++) {            // warten, bis die neue Instanz antwortet
      await new Promise(r => setTimeout(r, 500));
      try { await api("/api/state"); for (const k of Object.keys(drafts)) delete drafts[k]; await load(); flash(t("restartedUi")); return; } catch {}
    }
    flash(t("restartFailed"), "err");
  } catch (e) { flash(e.message, "err"); }
};
$("savecfg").onclick = async () => {
  try {
    await api("/api/config", {text: $("cfg").value});
    for (const k of Object.keys(drafts)) delete drafts[k];
    $("cfgmsg").innerHTML = `<span style="color:var(--ok)">${esc(t("saved"))}</span>`;
    load();
  } catch (e) { $("cfgmsg").innerHTML = `<span style="color:var(--err)">${esc(e.message)}</span>`; }
};
window.addEventListener("resize", () => plan && renderEditor());
window.addEventListener("beforeunload", (ev) => { if (Object.values(drafts).some(d => d.dirty)) ev.preventDefault(); });

// Fenster einklappen (Zustand pro Fenster merken)
let collapsed = {};
try { collapsed = JSON.parse(localStorage.getItem("fcwm.collapsed") || "{}"); } catch {}
document.querySelectorAll(".win[data-win]").forEach(w => {
  if (w.dataset.win in collapsed) w.classList.toggle("collapsed", collapsed[w.dataset.win]);
  const toggle = () => {
    collapsed[w.dataset.win] = w.classList.toggle("collapsed");
    try { localStorage.setItem("fcwm.collapsed", JSON.stringify(collapsed)); } catch {}
    if (!collapsed[w.dataset.win] && plan) renderEditor();
  };
  w.querySelector("[data-collapse]").onclick = toggle;
  w.querySelector(".bar").ondblclick = (ev) => { if (!ev.target.closest("button")) toggle(); };
});

applyStatic();
load();
connectEvents();
</script>
</body>
</html>
