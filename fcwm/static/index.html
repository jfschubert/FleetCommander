<header>
  <div class="brand"><img src="fcwm.svg" alt="">FleetCommander</div>
  <nav class="pages">
    <button class="page" data-page="layout" data-i18n="pgLayout"></button>
    <button class="page" data-page="settings" data-i18n="pgSettings"></button>
    <button class="page" data-page="about" data-i18n="pgAbout"></button>
  </nav>
  <div class="hdr-right">
    <span class="live" id="live"><i></i><span data-i18n="live"></span></span>
    <label class="switch"><input type="checkbox" id="autoToggle"><span class="track"></span><span class="lbl" data-i18n="autoTitle"></span></label>
    <label class="switch" id="lockWrap"><input type="checkbox" id="lockToggle"><span class="track"></span><span class="lbl" data-i18n="lockShort"></span></label>
  </div>
  <!-- custom window frame: only visible in the app window (fcwm app) -->
  <div class="winctl" id="winctl" hidden>
    <button id="winMin" data-i18n-title="winMin"><svg class="ic"><use href="#i-min"/></svg></button><button id="winMax" data-i18n-title="winMax"><svg class="ic"><use href="#i-max"/></svg></button><button id="winClose" class="close" data-i18n-title="winClose"><svg class="ic"><use href="#i-close"/></svg></button>
  </div>
</header>

<main class="page-layout" data-page="layout">
  <div class="col">
    <section class="win" data-win="profiles">
      <div class="bar"><svg class="ico"><use href="#i-profile"/></svg><h2 data-i18n="profiles"></h2><span class="extra" id="cfgpathTop"></span>
        <span class="ctl"><button class="wbtn" data-collapse><svg class="ic"><use href="#i-min"/></svg></button></span></div>
      <div class="body">
        <div class="tabs" id="tabs"></div>
        <div class="row">
          <input id="pname" size="22" aria-label="Name">
          <button class="primary" id="apply" data-i18n="apply"></button>
          <button id="save" data-i18n="save"></button>
          <button id="discard" data-i18n="discard"></button>
          <span class="sep"></span>
          <button id="refresh" data-i18n="refresh"></button>
          <button id="profmenu" class="more-btn" aria-haspopup="menu"><svg class="ic"><use href="#i-more"/></svg></button>
        </div>
        <details class="more" id="profmore">
          <summary data-i18n="moreProfile"></summary>
          <div class="row">
            <label class="f grow"><span data-i18n="description"></span><input id="pdesc"></label>
            <label class="f"><span data-i18n="focusEnd"></span><select id="pfocus"></select></label>
            <label class="f"><span data-i18n="profileHotkey"></span><input id="photkey" class="keycap" size="16" readonly></label>
          </div>
        </details>
        <div id="msgs"></div>
      </div>
    </section>
    <section class="win" data-win="layout">
      <div class="bar"><svg class="ico"><use href="#i-layout"/></svg><h2 data-i18n="layout"></h2><span class="info" data-tip="layoutHint">i</span>
        <span class="ctl"><button class="wbtn" data-collapse><svg class="ic"><use href="#i-min"/></svg></button></span></div>
      <div class="body">
        <div id="palette"></div>
        <div class="row" style="margin-top:8px">
          <input id="newchar" size="30">
          <button id="addchar" data-i18n="add"></button>
          <div class="legend" style="margin-left:auto">
            <span><i style="background:var(--pin);box-shadow:inset 2px 0 0 var(--blue-line)"></i><span data-i18n="lgPinned"></span></span>
            <span><i style="background:rgba(255,255,255,.12);box-shadow:inset 2px 0 0 rgba(255,255,255,.4)"></i><span data-i18n="lgAuto"></span></span>
            <span><i style="border:1px dashed var(--gold)"></i><span data-i18n="lgOffline"></span></span>
          </div>
        </div>
        <div id="canvas"></div>
        <div id="moncards"></div>
        <div id="planmsgs"></div>
      </div>
    </section>
  </div>
  <aside class="col">
    <section class="win" data-win="auto">
      <div class="bar"><svg class="ico"><use href="#i-auto"/></svg><h2 data-i18n="autoTitle"></h2>
        <span class="ctl"><button class="wbtn" data-collapse><svg class="ic"><use href="#i-min"/></svg></button></span></div>
      <div class="body" style="display:grid;gap:10px">
        <div class="banner off" id="autoBanner"><span id="autoBannerText"></span><span class="info" data-tip="autoHelp">i</span></div>
        <label class="switch"><input type="checkbox" id="autoToggle2"><span class="track"></span><span class="lbl" id="autoState"></span></label>
        <div class="kv">
          <span class="k" data-i18n="profile"></span><select id="autoProfile"></select>
          <span class="k" data-i18n="listener"></span><span id="listenerKind"></span>
        </div>
      </div>
    </section>
    <section class="win" data-win="clients">
      <div class="bar"><svg class="ico"><use href="#i-pilot"/></svg><h2 data-i18n="clients"></h2><span class="extra" id="clientCount"></span>
        <span class="ctl"><button class="wbtn" data-collapse><svg class="ic"><use href="#i-min"/></svg></button></span></div>
      <div class="body"><ul class="list" id="clients"></ul></div>
    </section>
    <section class="win" data-win="events">
      <div class="bar"><svg class="ico"><use href="#i-bell"/></svg><h2 data-i18n="events"></h2>
        <span class="ctl" style="margin-left:auto"><button class="wbtn" id="clearlog" title=""><svg class="ic"><use href="#i-eraser"/></svg></button><button class="wbtn" data-collapse><svg class="ic"><use href="#i-min"/></svg></button></span></div>
      <div class="body"><ul class="list" id="log"></ul></div>
    </section>
  </aside>
</main>
<main class="page-settings" data-page="settings" hidden>
  <div class="col">
    <section class="win" data-win="general">
      <div class="bar"><svg class="ico"><use href="#i-lang"/></svg><h2 data-i18n="general"></h2>
        <span class="ctl"><button class="wbtn" data-collapse><svg class="ic"><use href="#i-min"/></svg></button></span></div>
      <div class="body">
        <div class="kv"><span class="k" data-i18n="language"></span><select id="lang" aria-label="Language"></select></div>
      </div>
    </section>
    <section class="win" data-win="hotkeys">
      <div class="bar"><svg class="ico"><use href="#i-key"/></svg><h2 data-i18n="hotkeys"></h2><span class="info" data-tip="hkHint">i</span>
        <span class="ctl"><button class="wbtn" data-collapse><svg class="ic"><use href="#i-min"/></svg></button></span></div>
      <div class="body" style="display:grid;gap:8px">
        <div class="kv">
          <span class="k" data-i18n="hkNext"></span><input class="keycap" data-hk="next_profile" readonly>
          <span class="k" data-i18n="hkPrev"></span><input class="keycap" data-hk="prev_profile" readonly>
          <span class="k" data-i18n="hkCycle"></span><input class="keycap" data-hk="cycle_stack" readonly>
        </div>
      </div>
    </section>
    <section class="win" data-win="titlebars">
      <div class="bar"><svg class="ico"><use href="#i-brush"/></svg><h2 data-i18n="titlebars"></h2><span class="info" data-tip="tbHint">i</span>
        <span class="ctl"><button class="wbtn" data-collapse><svg class="ic"><use href="#i-min"/></svg></button></span></div>
      <div class="body" style="display:grid;gap:8px">
        <label class="switch"><input type="checkbox" id="tbHide"><span class="track"></span><span class="lbl" data-i18n="tbHide"></span></label>
        <div class="row"><span class="k" data-i18n="tbDefault"></span><span id="tbDefault" style="margin-left:auto"></span></div>
        <div class="row"><span class="k"><span data-i18n="sepWidth"></span> <span class="info" data-tip="sepHint">i</span></span>
          <span class="stepper" style="margin-left:auto"><button data-sep="-">−</button><span id="sepWidth"></span><button data-sep="+">+</button></span></div>
        <div class="row"><span class="k" data-i18n="sepColor"></span><span id="sepColor" style="margin-left:auto"></span></div>
        <div class="row"><span class="k" data-i18n="pvShow"></span><select id="sepShow" style="margin-left:auto">

          <span class="small" data-i18n="dbgIssueHint"></span>
        </div>
        <textarea id="dbgOut" rows="8" readonly hidden></textarea>

    <section class="win" data-win="config">
      <div class="bar"><svg class="ico"><use href="#i-gear"/></svg><h2 data-i18n="configFile"></h2><span class="extra" id="cfgpath"></span>
        <span class="ctl"><button class="wbtn" data-collapse><svg class="ic"><use href="#i-min"/></svg></button></span></div>
      <div class="body">
        <div class="row" style="margin-bottom:10px">
          <button id="reloadCfg" data-i18n="reloadCfg"></button>
          <button id="restartWm" data-i18n="restartWm"></button>

        <details id="cfgdetails">
          <summary><span data-i18n="editRaw"></span> <span class="info" data-tip="editRawHint">i</span></summary>
          <textarea id="cfg" spellcheck="false"></textarea>
          <div class="row" style="margin-top:8px">
            <button class="primary" id="savecfg" data-i18n="saveFile"></button>
            <span id="cfgmsg"></span>
          </div>
        </details>
      </div>
    </section>
